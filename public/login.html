<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Cache-Control" content="no-store"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ScholarScope — Login / Sign up</title>
  <style>
    :root{
      /* match your home page palette */
      --bg1:#235f9e; --bg2:#49d1a3; --nav:#0a1c30; --text:#e8f1ff;
      --card:#0f1d48; --line:#203066; --muted:#a6b3d1;
      --soft:#0c173a; --cta:#2f7bfd; --ctaHover:#2a6ee6;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--text);
      font-family:system-ui, Segoe UI, Roboto, Arial, sans-serif;
      background:linear-gradient(135deg, var(--bg1) 20%, var(--bg2) 120%);
      background-attachment:fixed;
      display:flex; flex-direction:column;
    }

    /* NAV */
    .nav{position:sticky; top:0; z-index:10; background:var(--nav);
         border-bottom:1px solid rgba(255,255,255,.08)}
    .nav-inner{max-width:1100px;margin:0 auto;padding:12px 16px;
               display:flex;align-items:center;gap:16px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800}
    .brand svg{width:26px;height:26px;display:block}
    .spacer{flex:1}
    .menu{display:flex;gap:16px;flex-wrap:wrap}
    .menu a{color:#cfe3ff;text-decoration:none;padding:8px 10px;border-radius:10px}
    .menu a:hover{background:#0f2a57}

    /* MAIN */
    .wrap{max-width:760px; width:92%; margin:32px auto; flex:1}
    .card{background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden;
          box-shadow:0 18px 50px rgba(0,0,0,.35)}
    .head{display:flex;align-items:center;justify-content:space-between;
          padding:16px 18px;border-bottom:1px solid var(--line)}
    .title{font-size:20px;font-weight:800}

    /* tabs */
    .tabs{display:flex;gap:8px}
    .tab{background:#0b1a45;border:1px solid #1c397e;color:#cfe1ff;
         padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:700}
    .tab.active{background:#13306e}
    .pane{display:none;padding:18px} .pane.active{display:block}

    /* forms */
    label{display:block;margin-top:10px;font-weight:700}
    input,select,button{font:inherit}
    input,select{
      width:100%;padding:12px;border-radius:12px;margin-top:6px;
      border:1px solid #26428e;background:#0a1636;color:#fff
    }
    .actions{display:flex;gap:8px;align-items:center;margin-top:12px}
    .btn{padding:10px 14px;border-radius:12px;border:0;cursor:pointer;font-weight:800}
    .btn.primary{background:var(--cta);color:#fff}
    .btn.primary:hover{background:var(--ctaHover)}
    .btn.ghost{background:transparent;color:#cfe3ff;border:1px solid #2f7bfd}
    .muted{color:var(--muted)}

    /* FOOTER */
    footer{border-top:1px solid rgba(255,255,255,.08);
           background:linear-gradient(135deg, var(--bg1), var(--bg2))}
    .foot{max-width:1100px;margin:0 auto;padding:18px 16px;text-align:center}
  </style>
</head>
<body>
  <!-- NAV -->
  <header class="nav">
    <div class="nav-inner">
      <div class="brand">
        <!-- tiny logo -->
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3 2 8l10 5 10-5-4-2" stroke="#9ad7ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 10v4c0 1.3 2.7 2.7 6 2.7s6-1.4 6-2.7v-4" stroke="#9ad7ff" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        ScholarScope
      </div>
      <div class="spacer"></div>
      <nav class="menu">
        <a href="/">Home</a>
        <a href="/#about">About Us</a>
        <a href="/#scholarships">Scholarships</a>
        <a href="/#howto">How to Apply</a>
        <a href="/#faqs">FAQs</a>
        <a href="/#contact">Contact Us</a>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main class="wrap">
    <div class="card" role="region" aria-labelledby="authTitle">
      <div class="head">
        <div class="title" id="authTitle">Access your account</div>
        <div class="tabs" role="tablist" aria-label="Auth tabs">
          <button class="tab active" role="tab" aria-selected="true" aria-controls="loginPane"  data-tab="login">Log in</button>
          <button class="tab"         role="tab" aria-selected="false" aria-controls="signupPane" data-tab="signup">Sign up</button>
        </div>
      </div>

      <!-- LOGIN -->
      <section id="loginPane" class="pane active" role="tabpanel" aria-labelledby="login tab">
        <form id="loginForm" autocomplete="on">
          <label for="lEmail">Email</label>
          <input id="lEmail" name="email" type="email" placeholder="you@example.com" required />
          <label for="lPass">Password</label>
          <input id="lPass" name="password" type="password" required />
          <div class="actions">
            <button class="btn primary" type="submit">Log in</button>
            <button class="btn ghost" type="button" id="logoutBtn">Log out</button>
            <span id="lMsg" class="muted"></span>
          </div>
        </form>
      </section>

      <!-- SIGN UP -->
      <section id="signupPane" class="pane" role="tabpanel" aria-labelledby="signup tab">
        <form id="signupForm" autocomplete="on">
          <label for="sName">Full name</label>
          <input id="sName" name="name" placeholder="Your name" required />

          <label for="sRole">Role</label>
          <select id="sRole" name="role">
            <option value="student">student</option>
            <option value="college">college</option>
          </select>

          <label for="sEmail">Email</label>
          <input id="sEmail" name="email" type="email" placeholder="you@example.com" required />

          <label for="sPass">Password</label>
          <input id="sPass" name="password" type="password" placeholder="min 6 characters" required />

          <div class="actions">
            <button class="btn primary" type="submit">Create account</button>
            <span id="sMsg" class="muted"></span>
          </div>
        </form>
      </section>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="foot">© <span id="y"></span> ScholarScope — Built for students, colleges & NGOs.</div>
  </footer>

  <script>
    (function(){
      const $ = (s)=>document.querySelector(s);

      // year
      $('#y').textContent = new Date().getFullYear();

      // Tabs
      const tabs = document.querySelectorAll('.tab');
      const panes = { login: $('#loginPane'), signup: $('#signupPane') };
      function show(which){
        tabs.forEach(t=>{
          const active = t.dataset.tab===which;
          t.classList.toggle('active', active);
          t.setAttribute('aria-selected', active ? 'true':'false');
        });
        panes.login.classList.toggle('active', which==='login');
        panes.signup.classList.toggle('active', which==='signup');
        if (location.hash !== '#'+which) history.replaceState(null,'','#'+which);
      }
      tabs.forEach(t=> t.addEventListener('click', ()=> show(t.dataset.tab)));
      window.addEventListener('hashchange', ()=> {
        const h=(location.hash||'#login').slice(1);
        show(h==='signup'?'signup':'login');
      });
      // initial
      show((location.hash||'#login').slice(1)==='signup'?'signup':'login');

      // Helpers
      const DEST = { student:'/student.html', college:'/college.html', admin:'/admin.html' }; // adjust if needed

      async function getMe(){
        try{
          const r = await fetch('/api/auth/me', {cache:'no-store', credentials:'same-origin'});
          const j = await r.json().catch(()=>null) || {};
          return j.user || null;
        }catch{ return null; }
      }
      function redirectFor(user){
        const to = DEST[user?.role] || '/';
        location.replace(to);
      }

      // LOGIN
      const lMsg = $('#lMsg');
      $('#loginForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        lMsg.textContent = 'Logging in…';
        try{
          const r = await fetch('/api/auth/login', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            credentials:'same-origin',
            body: JSON.stringify({
              email: $('#lEmail').value.trim(),
              password: $('#lPass').value
            })
          });
          const txt = await r.text(); let data=null; try{ data=JSON.parse(txt);}catch{}
          if(!r.ok) throw new Error((data && data.message) || txt || 'Login failed');

          lMsg.innerHTML = '<span style="color:#19b59e">Logged in ✔</span>';
          const me = await getMe();
          if (me) redirectFor(me);
        }catch(err){
          lMsg.innerHTML = `<span style="color:#ff8a8a">${err.message}</span>`;
        }
      });

      // LOGOUT (optional convenience)
      $('#logoutBtn').addEventListener('click', async ()=>{
        try{
          await fetch('/api/auth/logout', {method:'POST', credentials:'same-origin'});
          lMsg.textContent = 'Logged out.';
        }catch{}
      });

      // SIGN UP
      const sMsg = $('#sMsg');
      $('#signupForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        sMsg.textContent = 'Creating account…';
        try{
          const r = await fetch('/api/auth/register', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            credentials:'same-origin',
            body: JSON.stringify({
              name: $('#sName').value.trim(),
              email: $('#sEmail').value.trim(),
              password: $('#sPass').value,
              role: $('#sRole').value  // "student" or "college"
            })
          });
          const txt = await r.text(); let data=null; try{ data=JSON.parse(txt);}catch{}
          if(!r.ok){
            const msg = data?.message || data?.errors?.[0]?.msg || txt || 'Sign up failed';
            throw new Error(msg);
          }
          sMsg.innerHTML = '<span style="color:#19b59e">Account created & logged in ✔</span>';
          const me = await getMe();
          if (me) redirectFor(me);
        }catch(err){
          sMsg.innerHTML = `<span style="color:#ff8a8a">${err.message}</span>`;
        }
      });
    })();
  </script>
</body>
</html>
